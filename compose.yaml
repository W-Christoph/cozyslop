# CozyCast: one server plus one neko container per room.
# Configure via .env (see .env.example), then: docker compose up -d --build

x-room: &room
  build: ./worker
  image: cozycast-worker
  restart: unless-stopped
  shm_size: 2gb
  # neko's image gives the desktop user passwordless sudo. Whoever holds the
  # remote has a terminal, so this takes sudo (and every other setuid
  # program) away: they stay an ordinary user inside the room.
  security_opt:
    - no-new-privileges:true
  environment: &room-env
    NEKO_DESKTOP_SCREEN: ${SCREEN:-1280x720@30}
    # CozyCast's server is the only neko admin; browsers get per-user tokens.
    # Each room's admin token is derived from this secret and the room's
    # name (COZYCAST_ROOM), so one room's token does not open another.
    NEKO_MEMBER_PROVIDER: object
    COZYCAST_NEKO_SECRET: ${NEKO_API_TOKEN:?set NEKO_API_TOKEN in .env}
    NEKO_SESSION_COOKIE_ENABLED: "false"
    # Keep remote ownership enforced until the server restores room settings.
    NEKO_SESSION_IMPLICIT_HOSTING: "false"
    NEKO_SESSION_INACTIVE_CURSORS: "false"
    NEKO_CHAT_ENABLED: "false"
    NEKO_FILETRANSFER_ENABLED: "true"
    NEKO_FILETRANSFER_DIR: /home/cozycast/Downloads
    NEKO_FILETRANSFER_USER_UPLOAD: "true"
    NEKO_FILETRANSFER_USER_DOWNLOAD: "true"
    # Uploads go through file transfer, which checks the upload right;
    # drag-and-drop and file-dialog uploads only check remote control.
    NEKO_DESKTOP_UPLOAD_DROP: "false"
    NEKO_DESKTOP_FILE_CHOOSER_DIALOG: "false"
    # Encode once, H.264 for cheap decoding everywhere. The worker generates
    # one capture pipeline per bitrate, stream size and x264 preset (see
    # worker/entrypoint.sh); each room picks one in its settings, and neko
    # only runs pipelines someone is watching. Resolution and frame rate
    # follow the room's screen setting; a keyframe every 2 s.
    COZYCAST_X264_PRESET: ${X264_PRESET:-veryfast}
    COZYCAST_X264_PRESETS: ${X264_PRESETS:-ultrafast superfast veryfast}
    COZYCAST_STREAM_BITRATES: ${STREAM_BITRATES:-1000 1500 2500 4000 6000 8000}
    COZYCAST_STREAM_SCALES: ${STREAM_SCALES:-100 75 67 50}
    # Draw the host's mouse pointer into the stream so everyone sees it.
    NEKO_CAPTURE_VIDEO_SHOW_POINTER: "true"
    NEKO_WEBRTC_NAT1TO1: ${PUBLIC_IP:?set PUBLIC_IP in .env}

services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: cozycast-server
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:8080"
      - "${HTTPS_PORT:-443}:8443"
    environment:
      COZYCAST_NEKO_SECRET: ${NEKO_API_TOKEN}
      COZYCAST_ROOMS: default=http://room-default:8080
      COZYCAST_DEFAULT_SCREEN: ${SCREEN:-1280x720@30}
      COZYCAST_DATA_DIR: /data
      COZYCAST_IMPORT: /import/cozycast-export.tar.gz
      # Set DOMAIN for automatic HTTPS (Let's Encrypt); ports 80 and 443
      # must then be reachable from the internet.
      COZYCAST_DOMAIN: ${DOMAIN:-}
      COZYCAST_ACME_EMAIL: ${ACME_EMAIL:-}
      # Creates the "admin" account on first start.
      COZYCAST_INIT_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Opt-in room restart control from the UI. This gives the server
      # control over Docker on the host; only needed for UI room restarts.
      # Uncomment this, the socket volume, and group_add below together.
      # COZYCAST_DOCKER: "true"
    volumes:
      - server-data:/data
      - ./import:/import:ro
      # - /var/run/docker.sock:/var/run/docker.sock
    # The server runs as a non-root user; set DOCKER_GID in .env so it can
    # access the socket's group (see .env.example).
    # group_add: ["${DOCKER_GID}"]
    depends_on:
      - room-default
    # The server is on every room's network; the rooms are not on each
    # other's.
    networks:
      - room-default

  room-default:
    <<: *room
    ports:
      - "${MEDIA_PORT:-52000}:${MEDIA_PORT:-52000}/udp"
      - "${MEDIA_PORT:-52000}:${MEDIA_PORT:-52000}/tcp"
    networks:
      - room-default
    environment:
      <<: *room-env
      # The room's name in COZYCAST_ROOMS.
      COZYCAST_ROOM: default
      # Each room needs its own media port, open for UDP and TCP. Browsers
      # connect to exactly this port, so host and container port must match.
      NEKO_WEBRTC_UDPMUX: ${MEDIA_PORT:-52000}
      NEKO_WEBRTC_TCPMUX: ${MEDIA_PORT:-52000}
      # The old CozyCast room desktop (files, folders, Firefox profile) is
      # imported from the migration archive on first start, if it has one.
      COZYCAST_IMPORT_HOME: /import/cozycast-export.tar.gz
    volumes:
      # The room desktop's whole home folder: Desktop, Downloads, documents,
      # the Firefox profile. A named volume takes its ownership from the
      # image, so the desktop's non-root user can write to it (a bind-mounted
      # host folder would be created as root).
      - room-default-home:/home/cozycast
      - ./import:/import:ro

  # A second room: uncomment, then add "second=http://room-second:8080" to
  # COZYCAST_ROOMS above (comma separated) and "room-second" to the server's
  # networks.
  # room-second:
  #   <<: *room
  #   networks:
  #     - room-second
  #   environment:
  #     <<: *room-env
  #     COZYCAST_ROOM: second
  #     NEKO_WEBRTC_UDPMUX: 52001
  #     NEKO_WEBRTC_TCPMUX: 52001
  #   ports:
  #     - "52001:52001/udp"
  #     - "52001:52001/tcp"
  #   volumes:
  #     - room-second-home:/home/cozycast
  # (and add room-second-home under volumes: and room-second under networks:
  # at the bottom)

volumes:
  # Accounts, chat, uploads and certificates.
  server-data:
  # Each room desktop's home folder (files, Firefox profile).
  room-default-home:

networks:
  # One per room, shared with the server only: what runs on one room's
  # desktop cannot reach another room's neko.
  room-default:
