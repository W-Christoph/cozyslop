// CozyCast Firefox defaults. The first line of this file is skipped by Firefox.

// No updates inside the container; the image is rebuilt instead.
lockPref("app.update.auto", false);
lockPref("app.update.enabled", false);
lockPref("extensions.update.enabled", false);
lockPref("browser.shell.checkDefaultBrowser", false);
lockPref("browser.tabs.closeWindowWithLastTab", false);

// Skip first-run screens; nobody is there to click them away on a fresh room.
pref("browser.aboutwelcome.enabled", false);
pref("browser.startup.homepage_override.mstone", "ignore");
pref("datareporting.policy.dataSubmissionPolicyBypassNotification", true);
pref("termsofuse.bypassNotification", true);
pref("termsofuse.acceptedVersion", 999);
pref("trailhead.firstrun.didSeeAboutWelcome", true);

// Always reopen the previous tabs: after a room restart (a clean shutdown),
// after a crash, and for profiles imported from the old CozyCast.
pref("browser.startup.page", 3);
// After a crash, too, without asking.
// Firefox normally gives up after one unclean shutdown in a row and shows a
// "trouble getting your pages back" page that someone has to click away.
pref("browser.sessionstore.resume_from_crash", true);
pref("browser.sessionstore.max_resumed_crashes", 1000);

// CPU: there is no GPU, so every decoded frame costs CPU time. Disabling
// WebM/MSE and AV1 makes YouTube and most sites fall back to H.264, which is
// far cheaper to decode in software than VP9 or AV1.
pref("media.mediasource.webm.enabled", false);
pref("media.av1.enabled", false);
pref("media.autoplay.default", 0);

// Downloads land in ~/Downloads so they can be opened with VLC.
pref("browser.download.useDownloadDir", true);
pref("browser.download.folderList", 1);

// Dark UI to match the CozyCast theme.
pref("ui.systemUsesDarkTheme", 1);
pref("browser.theme.toolbar-theme", 0);
pref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");

// Tabs left open fill the room's memory, and at its cap the kernel ends a
// program there (a tab crashes). So tabs nobody looks at are unloaded, as
// Firefox itself does when the machine runs low, but going by the room's
// cap, which Firefox does not know of: a tab not looked at for
// cozycast.tabs.unload_idle_minutes (0 = never), and above
// cozycast.tabs.unload_above_percent of the cap the tab looked at least
// recently, one every 10 seconds until below. An unloaded tab stays in the
// tab bar and loads again when clicked. Never the tab in front, one playing
// sound, or one that asks before it is left (a form being filled in); a
// pinned tab only by the cap. The room's helper (window-title.py) says
// the memory used and the cap. The two settings are defaults: a profile
// (about:config) may change them.
defaultPref("cozycast.tabs.unload_idle_minutes", 30);
defaultPref("cozycast.tabs.unload_above_percent", 75);
try {
  (function () {
    const { classes: Cc, interfaces: Ci, utils: Cu } = Components;
    const MEMORY = "http://127.0.0.1:8081/memory";

    async function roomMemory(win) {
      try {
        const res = await win.fetch(MEMORY, { cache: "no-store" });
        return res.ok ? await res.json() : null;
      } catch (e) {
        return null;
      }
    }

    async function unloadTabs() {
      const windows = [...Services.wm.getEnumerator("navigator:browser")].filter((w) => w.gBrowser);
      if (!windows.length) return;
      const idle = Services.prefs.getIntPref("cozycast.tabs.unload_idle_minutes", 30) * 60000;
      const above = Services.prefs.getIntPref("cozycast.tabs.unload_above_percent", 75) / 100;
      // Loaded tabs that may go, the least recently looked at first.
      const tabs = [];
      for (const w of windows) {
        for (const tab of w.gBrowser.tabs) {
          if (tab.linkedPanel && !tab.selected && !tab.soundPlaying) tabs.push({ tab, gBrowser: w.gBrowser });
        }
      }
      tabs.sort((a, b) => a.tab.lastAccessed - b.tab.lastAccessed);
      const now = Date.now();
      for (const { tab, gBrowser } of tabs) {
        if (idle > 0 && !tab.pinned && now - tab.lastAccessed > idle) gBrowser.discardBrowser(tab);
      }
      if (above <= 0) return;
      const m = await roomMemory(windows[0]);
      if (!m || !m.limit || m.used < m.limit * above) return;
      // One at a time: its memory takes a moment to come free.
      for (const { tab, gBrowser } of tabs) {
        if (tab.linkedPanel && gBrowser.discardBrowser(tab)) return;
      }
    }

    let busy = false;
    const timer = Cc["@mozilla.org/timer;1"].createInstance(Ci.nsITimer);
    timer.initWithCallback({
      notify() {
        if (busy) return;
        busy = true;
        unloadTabs().catch((e) => Cu.reportError(e)).finally(() => { busy = false; });
      },
    }, 10000, Ci.nsITimer.TYPE_REPEATING_SLACK);
    // Kept, or the timer would be collected with this script.
    globalThis.cozycastTabUnloader = timer;
  })();
} catch (e) {
  Components.utils.reportError(e);
}
