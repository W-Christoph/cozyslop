// CozyCast Firefox defaults. The first line of this file is skipped by Firefox.

// No updates inside the container; the image is rebuilt instead.
lockPref("app.update.auto", false);
lockPref("app.update.enabled", false);
lockPref("extensions.update.enabled", false);
lockPref("browser.shell.checkDefaultBrowser", false);
lockPref("browser.tabs.closeWindowWithLastTab", false);

// Skip first-run screens; nobody is there to click them away on a fresh room.
pref("browser.aboutwelcome.enabled", false);
pref("browser.startup.homepage_override.mstone", "ignore");
pref("datareporting.policy.dataSubmissionPolicyBypassNotification", true);
pref("termsofuse.bypassNotification", true);
pref("termsofuse.acceptedVersion", 999);
pref("trailhead.firstrun.didSeeAboutWelcome", true);

// CPU: there is no GPU, so every decoded frame costs CPU time. Disabling
// WebM/MSE and AV1 makes YouTube and most sites fall back to H.264, which is
// far cheaper to decode in software than VP9 or AV1.
pref("media.mediasource.webm.enabled", false);
pref("media.av1.enabled", false);
pref("media.autoplay.default", 0);

// Downloads land in ~/Downloads so they can be opened with VLC.
pref("browser.download.useDownloadDir", true);
pref("browser.download.folderList", 1);

// Dark UI to match the CozyCast theme.
pref("ui.systemUsesDarkTheme", 1);
pref("browser.theme.toolbar-theme", 0);
pref("extensions.activeThemeID", "firefox-compact-dark@mozilla.org");
