[program:firefox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/firefox --no-remote -P default --display=%(ENV_DISPLAY)s
stopsignal=INT
autorestart=true
; start after the XFCE session (priority 500)
priority=800
user=%(ENV_USER)s
stdout_logfile=/var/log/neko/firefox.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
redirect_stderr=true

; Answers the CozyCast server's question which window is in front (see
; window-title.py). Not the desktop's user, so that whoever holds the remote
; cannot stop or replace it.
[program:window-title]
environment=DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/python3 /usr/local/bin/cozycast-window-title
autorestart=true
user=nobody
stdout_logfile=/var/log/neko/window-title.log
stdout_logfile_maxbytes=1MB
stdout_logfile_backups=1
redirect_stderr=true
